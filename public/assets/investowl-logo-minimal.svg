<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0E2"/>
      <stop offset="40%" stop-color="#FFB879"/>
      <stop offset="100%" stop-color="#E86A17"/>
    </linearGradient>
    <linearGradient id="shieldBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1A2A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0D0A14" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Frame -->
  <path d="M256 36 L436 104 V248 C436 360 356 452 256 484 C156 452 76 360 76 248 V104 L256 36 Z"
        fill="url(#shieldBgGrad)"
        stroke="url(#goldGrad)"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Inner Subtle Offset Border -->
  <path d="M256 64 L410 122 V244 C410 340 342 420 256 448 C170 420 102 340 102 244 V122 L256 64 Z"
        fill="none"
        stroke="url(#goldGrad)"
        stroke-width="2.5"
        stroke-opacity="0.35"
        stroke-linecap="round" />

  <!-- Minimalist Owl Horns / Brow Line -->
  <path d="M138 156 L216 200 L256 172 L296 200 L374 156"
        stroke="url(#goldGrad)"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Left Eye: Precision Telemetry Rings -->
  <circle cx="200" cy="260" r="52" stroke="url(#goldGrad)" stroke-width="14" fill="none" />
  <circle cx="200" cy="260" r="20" fill="url(#goldGrad)" />

  <!-- Right Eye: Precision Telemetry Rings -->
  <circle cx="312" cy="260" r="52" stroke="url(#goldGrad)" stroke-width="14" fill="none" />
  <circle cx="312" cy="260" r="20" fill="url(#goldGrad)" />

  <!-- Center Beak: Geometric Sharp Prism -->
  <polygon points="256,268 234,316 278,316" fill="url(#goldGrad)" />

  <!-- Lower Wing Facet Lines / Feather Arch -->
  <path d="M164 348 C198 384 226 404 256 414 C286 404 314 384 348 348"
        stroke="url(#goldGrad)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Subtle Wing Accents -->
  <path d="M190 320 L152 368"
        stroke="url(#goldGrad)"
        stroke-width="10"
        stroke-linecap="round"
        stroke-opacity="0.65" />
  <path d="M322 320 L360 368"
        stroke="url(#goldGrad)"
        stroke-width="10"
        stroke-linecap="round"
        stroke-opacity="0.65" />
</svg>